name: Rust

on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (if Ubuntu)
        env:
          ACCEPT_EULA: Y
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsqlite3-dev libclang-19-dev pkg-config
        if: contains(runner.os, 'Linux')

      - uses: Swatinem/rust-cache@v2

      # wireguard-control's device test needs a userspace WireGuard binary,
      # which CI does not provision. It is excluded rather than allowed to
      # fail: everything else still runs and must pass.
      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Test
        run: cargo test --workspace --locked --verbose --exclude wireguard-control

      - name: Test (IPv6)
        run: cargo test --workspace --locked --features v6-test --verbose --exclude wireguard-control

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stable, not nightly. rustfmt.toml sets unstable options
      # (imports_granularity, indent_style, reorder_impl_items); on stable they
      # are ignored with a warning rather than being an error, so the check
      # stays meaningful without depending on a specific nightly date that may
      # not exist on the rustup mirror. Pinning a nightly date broke CI once
      # already for exactly that reason.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rustfmt
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Dependencies
        run: sudo apt-get -y update && sudo apt-get -y install libsqlite3-dev libclang-19-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/install@cargo-docs-rs
      - name: Install System Dependencies
        run: sudo apt-get -y update && sudo apt-get -y install libsqlite3-dev libclang-19-dev
      - name: Run cargo docs-rs on all workspace members
        run: |
          # cargo metadata lists workspace members, jq filters them to ones that are libraries (as
          # cargo docs-rs fails on bin/only crates) and extracts their names.
          for pkg in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select([.targets[].kind[]] | join(" ") | test("lib|proc-macro")) | .name'); do
            echo "::group::Building docs for $pkg"
            cargo docs-rs -p "$pkg"
            echo "::endgroup::"
          done

  # The GUI is a separate workspace with its own lockfile, so it needs its own
  # jobs rather than being picked up by the workspace commands above.
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The installer is POSIX sh; dash on Debian is the strictest common
      # interpreter, so it is a better check than bash.
      - name: Syntax check (dash)
        run: dash -n install.sh
      - name: Tests
        run: sh tests/install-test.sh
      # Homebrew formula: catch syntax errors and missing DSL declarations
      # without needing a macOS runner or a tap checkout.
      - name: Formula syntax
        run: ruby -c homebrew/Formula/innernet.rb
      # The release workflow rewrites the formula from SHA256SUMS. Exercise the
      # rewriter here so a broken updater fails on the PR rather than at tag
      # time, when the release is already half published.
      - name: Formula updater tests
        run: python3 scripts/test-update-homebrew-formula.py
      # Catch the case this was all written for: a tag went out but the formula
      # still points at an older version.
      - name: Formula matches the crate version
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version' client/Cargo.toml | cut -d'"' -f2)
          formula=$(grep -m1 '^  version' homebrew/Formula/innernet.rb | cut -d'"' -f2)
          echo "crate:   $crate"
          echo "formula: $formula"
          if [ "$crate" != "$formula" ]; then
            echo "::error::homebrew/Formula/innernet.rb is at $formula but the crate is at $crate. The release workflow bumps it automatically, so this means the bump was missed."
            exit 1
          fi

  gui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsqlite3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      # The backend shells out to the CLI, and its unit tests pin the exact
      # argv each action produces plus the input validation rules.
      - name: Backend tests
        working-directory: gui/src-tauri
        run: cargo test --locked

      # These import the role logic straight out of index.html, so the UI and
      # the test cannot drift apart.
      - name: Role gating tests
        run: |
          node gui/tests/role-gating.test.mjs
          node gui/tests/unit-variant-args.test.mjs
          node gui/tests/setup-screen.test.mjs
          node gui/tests/connect-toggle.test.mjs

      - name: Build
        working-directory: gui/src-tauri
        run: cargo build --release
