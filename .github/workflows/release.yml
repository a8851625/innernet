name: Release

# Builds every artefact and publishes it to a GitHub Release.
#
# Two ways to run:
#   * push a tag  -> builds, creates the Release, uploads everything
#   * manual      -> builds and uploads as workflow artifacts only
#
# Binaries are built on native runners rather than cross-compiled, because
# innernet links against the platform's SQLite and WireGuard interfaces: a
# cross build would not prove either one works.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # CLI + server. Each target gets its own native runner.
  # ---------------------------------------------------------------------------
  cli-server:
    name: cli+server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds both architectures on the arm64 runner; the other
          # targets build for their host default.
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p innernet -p innernet-server

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Tag builds carry the version in the ref; manual runs read it from
          # the manifest. Grepping beats jq here because jq is not present on
          # the Windows runner's bash.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(grep -m1 '^version' client/Cargo.toml | cut -d'"' -f2)
          fi
          name="innernet-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"

          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/innernet${ext}" "dist/$name/"
          cp "target/${{ matrix.target }}/release/innernet-server${ext}" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          [ -d doc ] && cp -R doc "dist/$name/" || true

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            rm -rf "$name"
            echo "ARTIFACT=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            rm -rf "$name"
            echo "ARTIFACT=$name.tar.gz" >> "$GITHUB_ENV"
          fi

          # The installer verifies this. Each matrix job produces its own
          # fragment because jobs run on separate machines; the checksum job
          # below merges them into one SHA256SUMS.
          # Name the fragment after the target: every matrix job produces a
          # file called SHA256SUMS.part, and the merge job downloads them into
          # one directory, so identical names would overwrite each other and
          # silently drop all but one platform.
          fragment="SHA256SUMS-${{ matrix.target }}.part"
          if command -v sha256sum > /dev/null; then
            sha256sum *.tar.gz *.zip > "$fragment" 2>/dev/null || true
          else
            shasum -a 256 *.tar.gz *.zip > "$fragment" 2>/dev/null || true
          fi
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: cli-server-${{ matrix.target }}
          path: |
            dist/*
            !dist/SHA256SUMS-*.part
          if-no-files-found: error

      # Upload the checksum fragment separately so the merge job can find it
      # without downloading the (much larger) archives.
      - uses: actions/upload-artifact@v4
        with:
          name: sums-${{ matrix.target }}
          path: dist/SHA256SUMS-*.part
          if-no-files-found: warn

      # Attach to the Release when this run was triggered by a tag.
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ARTIFACT }}
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Desktop GUI. Tauri needs each platform's own webview, so one job per OS.
  # ---------------------------------------------------------------------------
  gui:
    name: gui (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon is the primary macOS target; Intel builds are not
          # produced because the GUI is only distributed to the machines this
          # fork is actually deployed on.
          - os: macos-latest
            platform: macos-aarch64
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            rust_target: ""
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsqlite3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      # The GUI shells out to the CLI, but it parses `show --json`, so the
      # parser and the argv mapping are worth testing on every platform.
      - name: Backend tests
        working-directory: gui/src-tauri
        run: cargo test --locked

      - name: Role gating tests
        run: node gui/tests/role-gating.test.mjs

      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          args: ${{ matrix.args }}
          # tauri-action publishes straight to the Release for tag builds.
          # An empty tagName means "do not touch releases".
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('innernet {0}', github.ref_name) || '' }}
          releaseBody: ""
          releaseDraft: false
          prerelease: false

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find gui/src-tauri/target -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" \
               -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.AppImage" \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -lh dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Merge the per-platform checksum fragments into one SHA256SUMS and attach it
  # to the Release. The install script looks for that single file.
  # ---------------------------------------------------------------------------
  checksums:
    name: checksums
    needs: [cli-server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sums-*
          path: fragments
          merge-multiple: true

      - name: Merge
        run: |
          set -euo pipefail
          # Fragments are "<sha>  <file>"; sorting gives a stable file.
          cat fragments/*.part | sort -k2 > SHA256SUMS
          echo "--- merged ---"
          cat SHA256SUMS

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Guards. These do not publish anything; they stop a broken tag from
  # producing a Release.
  # ---------------------------------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
