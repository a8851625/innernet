name: Release

# Builds every artefact and publishes it to a GitHub Release.
#
# Two ways to run:
#   * push a tag  -> builds, creates the Release, uploads everything
#   * manual      -> builds and uploads as workflow artifacts only
#
# Binaries are built on native runners rather than cross-compiled, because
# innernet links against the platform's SQLite and WireGuard interfaces: a
# cross build would not prove either one works.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # CLI + server. Each target gets its own native runner.
  # ---------------------------------------------------------------------------
  cli-server:
    name: cli+server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # GitHub only allows container: at job level, not per step. The Linux
    # targets get a manylinux2014 image so the glibc floor is pinned to 2.17
    # rather than inherited from the runner image; macOS targets leave it unset
    # and run directly on the runner.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The glibc floor matters more than the runner: a binary can only run
          # on glibc >= the one it was linked against. GitHub's oldest runner
          # image is ubuntu-22.04 (glibc 2.35), which excludes RHEL 8 / Alma 8 /
          # Alibaba Cloud Linux 3 (glibc 2.32) and Debian 10. So the Linux
          # builds run inside manylinux_2_28 containers, pinning the floor at
          # glibc 2.28 regardless of what the runner image ships.
          #
          # 2.28 is also the practical lower bound here: the Actions runner agent
          # is a Node 24 binary that needs glibc >= 2.28, so a 2.17 image
          # (manylinux2014) cannot even run actions/checkout -- it dies with
          # "GLIBC_2.28 not found" before the first step.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds both architectures on the arm64 runner; the other
          # targets build for their host default.
          targets: ${{ matrix.target }}

      - name: Verify the toolchain (Linux, container)
        # Nothing to install: SQLite is compiled in (rusqlite "bundled"), and the
        # manylinux images already carry a C toolchain. This step exists to make
        # the build environment visible in the log, since a surprise here is
        # what would move the glibc floor.
        if: runner.os == 'Linux'
        run: |
          echo "glibc: $(ldd --version | head -1)"
          echo "gcc:   $(gcc --version | head -1)"
          echo "objdump: $(command -v objdump)"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        # The container images pin the glibc floor (2.17 on manylinux2014), which
        # is the whole point of using them. SQLite is vendored for the same
        # reason: linking the system libsqlite3 would drag in whatever glibc the
        # image happens to have.
        run: cargo build --release --locked --target ${{ matrix.target }} -p innernet -p innernet-server

      # Guard against silently shipping a binary that only runs on the build
      # host. The glibc floor is a hard compatibility promise, so assert it
      # rather than discovering it from a user's "version GLIBC_2.34 not found".
      - name: Assert the glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          limit=2.28
          fail=0
          for bin in target/${{ matrix.target }}/release/innernet \
                     target/${{ matrix.target }}/release/innernet-server; do
            worst=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                    | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$(basename "$bin") needs glibc <= $worst"
            if [ "$(printf '%s\n%s\n' "$limit" "$worst" | sort -V | tail -1)" != "$limit" ]; then
              echo "::error::$(basename "$bin") requires glibc $worst, above the $limit floor"
              fail=1
            fi
          done
          exit $fail

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Tag builds carry the version in the ref; manual runs read it from
          # the manifest. Grepping beats jq here because jq is not present on
          # the Windows runner's bash.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(grep -m1 '^version' client/Cargo.toml | cut -d'"' -f2)
          fi
          name="innernet-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"

          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/innernet${ext}" "dist/$name/"
          cp "target/${{ matrix.target }}/release/innernet-server${ext}" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          [ -d doc ] && cp -R doc "dist/$name/" || true

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            rm -rf "$name"
            echo "ARTIFACT=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            rm -rf "$name"
            echo "ARTIFACT=$name.tar.gz" >> "$GITHUB_ENV"
          fi

          # The installer verifies this. Each matrix job produces its own
          # fragment because jobs run on separate machines; the checksum job
          # below merges them into one SHA256SUMS.
          # Name the fragment after the target: every matrix job produces a
          # file called SHA256SUMS.part, and the merge job downloads them into
          # one directory, so identical names would overwrite each other and
          # silently drop all but one platform.
          fragment="SHA256SUMS-${{ matrix.target }}.part"
          if command -v sha256sum > /dev/null; then
            sha256sum *.tar.gz *.zip > "$fragment" 2>/dev/null || true
          else
            shasum -a 256 *.tar.gz *.zip > "$fragment" 2>/dev/null || true
          fi
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: cli-server-${{ matrix.target }}
          path: |
            dist/*
            !dist/SHA256SUMS-*.part
          if-no-files-found: error

      # Upload the checksum fragment separately so the merge job can find it
      # without downloading the (much larger) archives.
      - uses: actions/upload-artifact@v4
        with:
          name: sums-${{ matrix.target }}
          path: dist/SHA256SUMS-*.part
          if-no-files-found: warn

      # Attach to the Release when this run was triggered by a tag.
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ARTIFACT }}
          fail_on_unmatched_files: true

  # aarch64 Linux lives in its own job rather than in the matrix above.
  #
  # It is a convenience target -- nothing is blocked on it -- but its manylinux
  # container is the least reliable thing in this workflow: runs keep dying
  # inside actions/checkout because the image pull fails. While it was a matrix
  # member, that failure cancelled the still-queued macOS jobs, which dropped
  # aarch64-apple-darwin.tar.gz from the release, which left SHA256SUMS
  # incomplete, which made the Homebrew job refuse to publish. One flaky image
  # took out the whole release through a chain of correct guards.
  #
  # continue-on-error keeps a failure here from failing the workflow, and being
  # outside the matrix means it cannot cancel anything else.
  aarch64-linux:
    name: cli+server (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_aarch64
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 '^version' client/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-gnu \
            -p innernet -p innernet-server

      - name: Assert the glibc floor
        run: |
          limit=2.28
          fail=0
          for bin in target/aarch64-unknown-linux-gnu/release/innernet \
                     target/aarch64-unknown-linux-gnu/release/innernet-server; do
            [ -f "$bin" ] || { echo "::error::$bin was not built"; fail=1; continue; }
            need=$(objdump -T "$bin" 2>/dev/null \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1 | sed 's/GLIBC_//')
            echo "$(basename "$bin") needs glibc <= ${need:-unknown}"
            if [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$limit" "$need" | sort -V | tail -1)" != "$limit" ]; then
              echo "::error::$(basename "$bin") needs glibc $need, above the $limit floor"
              fail=1
            fi
          done
          exit $fail

      - name: Package
        run: |
          version="${{ steps.version.outputs.version }}"
          target=aarch64-unknown-linux-gnu
          name="innernet-${version}-${target}"
          mkdir -p "dist/$name"
          cp target/$target/release/innernet target/$target/release/innernet-server "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          mkdir -p "dist/$name/doc"
          cp -r doc/* "dist/$name/doc/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "SHA256SUMS-$target.part" )
          echo "ARTIFACT=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-server-aarch64-unknown-linux-gnu
          path: dist/${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Upload checksum fragment
        uses: actions/upload-artifact@v4
        with:
          name: sums-aarch64-unknown-linux-gnu
          path: dist/SHA256SUMS-*.part
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ARTIFACT }}
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Desktop GUI. Tauri needs each platform's own webview, so one job per OS.
  # ---------------------------------------------------------------------------
  gui:
    name: gui (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon is the primary macOS target; Intel builds are not
          # produced because the GUI is only distributed to the machines this
          # fork is actually deployed on.
          - os: macos-latest
            platform: macos-aarch64
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            rust_target: ""
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsqlite3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      # The GUI shells out to the CLI, but it parses `show --json`, so the
      # parser and the argv mapping are worth testing on every platform.
      - name: Backend tests
        working-directory: gui/src-tauri
        run: cargo test --locked

      - name: Role gating tests
        run: |
          node gui/tests/role-gating.test.mjs
          node gui/tests/unit-variant-args.test.mjs
          node gui/tests/setup-screen.test.mjs
          node gui/tests/connect-toggle.test.mjs

      # Build the CLI first: the app bundle ships it, so installing the .dmg is
      # enough and there is no separate `brew install` step to get wrong.
      #
      # Not on Windows. The innernet CLI does not compile there at all --
      # wireguard-control is Unix-only (libc::IFNAMSIZ, std::os::unix) because
      # the userspace backend talks to a Unix socket. The Windows GUI therefore
      # remains a front-end that needs a CLI from elsewhere, and the version
      # gate tells the user so instead of showing an empty list.
      - name: Build the CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p innernet \
            ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
          echo "CLI built"

      # Bundle only -- publishing happens in a later step, because the CLI has
      # to be injected into the .app before the .dmg is made from it.
      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          # macOS: build only the .app here. The .dmg is made after the CLI is
          # injected, otherwise the published disk image would lack the CLI.
          args: ${{ runner.os == 'macOS' && format('--bundles app {0}', matrix.args) || matrix.args }}
          # An empty tagName means "do not touch releases"; the inject step
          # below needs the bundle to exist first, so publishing is separate.
          tagName: ""

      - name: Inject the CLI into the bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.rust_target }}"
          cli="target/release/innernet"
          if [ -n "$target" ]; then
            cli="target/$target/release/innernet"
          fi
          [ -f "$cli.exe" ] && cli="$cli.exe"

          case "${RUNNER_OS}" in
            macOS)
              app=$(find gui/src-tauri/target -maxdepth 6 -name "innernet.app" -type d | head -1)
              [ -n "$app" ] || { echo "no .app found"; exit 1; }
              sh gui/inject-cli.sh "$app" "$cli"
              # The DMG must be rebuilt from the app we just modified.
              version=$(grep -m1 '^version' gui/src-tauri/Cargo.toml | cut -d'"' -f2)
              dmg="gui/src-tauri/target/release/bundle/dmg/innernet_${version}_aarch64.dmg"
              mkdir -p "$(dirname "$dmg")"
              # A bare .app on the volume leaves the user guessing; the usual
              # /Applications symlink makes the drag-to-install gesture obvious.
              stage=$(mktemp -d)
              cp -R "$app" "$stage/"
              ln -s /Applications "$stage/Applications"
              hdiutil create -volname innernet -srcfolder "$stage" -ov -format UDZO "$dmg"
              rm -rf "$stage"
              echo "built $dmg"
              ;;
          esac

      - name: Publish the bundles
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ format('innernet {0}', github.ref_name) }}
          draft: false
          prerelease: false
          files: |
            gui/src-tauri/target/**/*.dmg
            gui/src-tauri/target/**/*.app.tar.gz
            gui/src-tauri/target/**/*-setup.exe
            gui/src-tauri/target/**/*.msi

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find gui/src-tauri/target -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" \
               -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.AppImage" \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -lh dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Merge the per-platform checksum fragments into one SHA256SUMS and attach it
  # to the Release. The install script looks for that single file.
  # ---------------------------------------------------------------------------
  checksums:
    name: checksums
    needs: [cli-server]
    # `always()` rather than the default: without it a single platform failing
    # makes GitHub skip this job entirely, so a release ships with no
    # SHA256SUMS at all and both install.sh and the Homebrew formula lose their
    # only source of truth. Partial checksums plus a visible failure upstream
    # are strictly better than silence. The Homebrew job below still refuses to
    # run unless every macOS archive actually arrived.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sums-*
          path: fragments
          merge-multiple: true

      - name: Merge
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(fragments/*.part)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "no checksum fragments were produced; the build jobs failed" >&2
            exit 1
          fi
          # Fragments are "<sha>  <file>"; sorting gives a stable file.
          cat "${parts[@]}" | sort -k2 > SHA256SUMS
          echo "--- merged (${#parts[@]} platform(s)) ---"
          cat SHA256SUMS

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Homebrew. Rewrite the formula in the tap repository so `brew install` always
  # gets the tag that was just published.
  #
  # This is automated because it used to be a manual step, and a manual step
  # that nobody notices is missing: the tap sat three releases behind while
  # every release run went green, so `brew install` kept handing out an old
  # binary with no indication anything was wrong.
  # ---------------------------------------------------------------------------
  homebrew:
    name: homebrew formula
    needs: [cli-server, checksums]
    # Not `needs` on the whole matrix: the formula only ships the two macOS
    # archives, so a Linux target failing (or being cancelled for concurrency)
    # has no bearing on it. The step below re-checks that the macOS archives
    # are really on the release before touching the tap, which is the property
    # that actually matters.
    if: |
      always() && startsWith(github.ref, 'refs/tags/')
      && needs.checksums.result == 'success'
      && needs.cli-server.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The formula only ships the two macOS archives, so a release missing one
      # of them must not be published to the tap. This also catches the case
      # where a matrix job failed and checksums only has partial content.
      - name: Require both macOS archives
        run: |
          set -euo pipefail
          missing=0
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --json assets --jq '.assets[].name' \
               | grep -qx "innernet-${GITHUB_REF_NAME#v}-${target}.tar.gz"; then
              echo "present: $target"
            else
              echo "::error::the release is missing innernet-${GITHUB_REF_NAME#v}-${target}.tar.gz, refusing to update the tap"
              missing=1
            fi
          done
          exit "$missing"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download SHA256SUMS from the release
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir . --clobber
          cat SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite the formula
        run: |
          set -euo pipefail
          python3 scripts/update-homebrew-formula.py \
            --version "${GITHUB_REF_NAME#v}" \
            --sums SHA256SUMS \
            --formula homebrew/Formula/innernet.rb
          ruby -c homebrew/Formula/innernet.rb

      - name: Self-check the updater
        run: python3 scripts/test-update-homebrew-formula.py

      # Pushing to the tap needs a token that can write to another repository;
      # the workflow's own GITHUB_TOKEN cannot. TAP_TOKEN is a fine-grained PAT
      # scoped to a8851625/homebrew-innernet with contents:write.
      - name: Push to the tap
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::TAP_TOKEN is not set, so the formula cannot be published. See homebrew/README.md."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          tap_dir="$RUNNER_TEMP/tap"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/a8851625/homebrew-innernet.git" "$tap_dir"
          cp homebrew/Formula/innernet.rb "$tap_dir/Formula/innernet.rb"

          cd "$tap_dir"
          if git diff --quiet -- Formula/innernet.rb; then
            echo "the tap already points at $version, nothing to do"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "innernet ${version}"
          git push origin HEAD:main
          echo "published innernet ${version} to the tap"
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Homebrew"
            echo ""
            echo "version: \`${GITHUB_REF_NAME#v}\`"
            echo ""
            echo '```'
            grep -E '^\s*version|url "https|sha256 "' homebrew/Formula/innernet.rb || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Guards. These do not publish anything; they stop a broken tag from
  # producing a Release.
  # ---------------------------------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
